<section class="section reveal" aria-labelledby="spec-title">
  <div class="wrap">
    <h2 class="section-title" id="spec-title">書籍情報 <span class="en">Book</span></h2>
    <dl class="info">
      <div class="info-row"><dt>書名</dt><dd>{{ book.title }}</dd></div>
      <div class="info-row"><dt>判型・ページ数</dt><dd>{{ book.spec.size }}</dd></div>
      <div class="info-row"><dt>頒布形態</dt><dd>{{ book.spec.format }}</dd></div>
      <div class="info-row"><dt>初版発行</dt><dd>{{ book.spec.published }}</dd></div>
      <div class="info-row"><dt>発行</dt><dd>やさしいデザイン塾</dd></div>
    </dl>
  </div>
</section>
