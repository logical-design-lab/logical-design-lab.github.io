<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% assign full_title = page.title %}
{% if page.title != site.title %}{% assign full_title = page.title | append: "｜" | append: site.title %}{% endif %}
<title>{{ full_title }}</title>
<meta name="description" content="{{ page.description }}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ full_title }}">
<meta property="og:description" content="{{ page.description }}">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<meta property="og:image" content="{{ site.url }}/assets/img/ogp.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{ site.url }}/assets/img/ogp.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
<script>document.documentElement.classList.add('js');</script>
